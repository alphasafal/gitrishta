name: 🐛 Bug report
description: Something looks broken
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Link that shows the bug
      placeholder: https://alphasafal.github.io/gitrishta/?u=...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
